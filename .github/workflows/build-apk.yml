# AnalysisAssistant — cloud APK build (GitHub Actions)
#
# Why this exists: Sulaiman edits code from his phone (GitHub web editor or
# AIDE) and cannot build the Kotlin/Gradle APK on the phone. Every push to
# main — or a manual run from the Actions tab — builds the debug APK here
# and attaches it as a downloadable artifact. No code is written by this
# workflow; it only tests and builds what is already in the repo.
#
# How to use it (on the phone):
#   1. Edit a file on github.com/Sulaiman507/AnalysisAssistant (pencil icon)
#      and commit it to main — or open Actions > "Build AnalysisAssistant APK"
#      > Run workflow.
#   2. When the run finishes green, open the run > Artifacts >
#      analysis-assistant-debug-apk and download app-debug.apk.
#   3. Install it on the phone. NOTE: this APK is signed with the runner's
#      auto-generated debug key, NOT the local debug.keystore (which is
#      gitignored and lives only on the dev machine). Android refuses to
#      install it over the 0.1.5 build signed with the other key, so
#      UNINSTALL the old "مساعد التحليل" first, then install this one.
#      (The app's data is only test logs, so nothing is lost.)
#
# What it runs, in order:
#   - :mcp:test — the MCP module unit tests (18 test classes, 98 tests).
#   - assembleDebug — the debug APK (versionCode 20, 0.1.19-zro-picker).
# The live MT-tool-name check (tools/verify-local.sh step 1) does NOT run
# here: it needs the live tools list file, which is not in the repo. That
# check still runs locally before a release build.
#
# Stack (matches the repo, aligned with ArDroid which builds this way):
#   AGP 9.4.1, Kotlin 2.4.20, Gradle 9.8.2, compileSdk 36, JDK 21.

name: Build AnalysisAssistant APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out AnalysisAssistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default packages fail (Google removed the legacy
          # "tools" package); platform + build-tools are installed below.
          packages: platform-tools

      - name: Install Android platform + build-tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run MCP unit tests
        run: |
          chmod +x gradlew
          ./gradlew :mcp:test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Show APK info
        run: ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
